<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Startrips 私人旅程图谱。把走过的路、沿途的照片与故事留在地球上。" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/startrips-v12-icon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/startrips-v12-touch-180.png" />
    <title>Startrips · Living Atlas</title>

  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === "file:") {
        document.body.style.cssText = "margin:0;background:#0b1020;color:#fff8e7;font-family:system-ui,sans-serif";
        document.getElementById("root").innerHTML = `
          <main style="max-width:560px;margin:12vh auto;padding:24px;line-height:1.8">
            <img src="./public/brand/startrips-v12-mark.svg" alt="" width="96" height="96">
            <h1 style="font-size:26px">请从预览地址打开 Startrips</h1>
            <p>这个文件是应用的源码入口，需要开发服务加载。</p>
            <p><a style="color:#7ce0c3" href="http://127.0.0.1:5173/?demo=1">无需账号，预览旅程图谱</a></p>
            <p style="color:#a6b3c3;font-size:13px">如果交互预览尚未启动，在项目目录运行 pnpm dev。</p>
          </main>`;
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
