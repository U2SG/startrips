name: prepare-media-presentation-schema
on:
  push:
    branches: [agent/live-media-presentation]
    paths: [.github/workflows/prepare-media-presentation-schema.yml, server/db/app-schema.ts]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - uses: actions/upload-artifact@v7
        with:
          name: generated-migrations
          path: server/db/migrations/
