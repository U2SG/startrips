name: merge-readiness

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - ready_for_review
      - converted_to_draft
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

# Do not use Actions concurrency cancellation here. Cancelled controller jobs remain
# attached to the PR head and make GitHub render an otherwise-green merged PR with a
# red aggregate check. Instead every event completes normally, while the controller
# proves that its run is still the newest run for this PR head before mutating the
# shared label/status state. Superseded runs therefore become successful no-ops.

permissions:
  actions: read
  contents: read
  checks: read
  statuses: write
  pull-requests: write
  issues: write

jobs:
  merge-readiness-controller:
    name: merge-readiness-controller
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      RUN_ID: ${{ github.run_id }}
      STATUS_TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Defer stacked PRs until they target main
        if: github.event.pull_request.base.ref != 'main'
        run: |
          echo "This PR targets ${{ github.event.pull_request.base.ref }}; merge readiness is enforced after retargeting to main."

      - name: Invalidate stale sign-off
        if: >-
          github.event.pull_request.base.ref == 'main' &&
          !(github.event_name == 'pull_request' &&
            github.event.action == 'labeled' &&
            github.event.label.name == 'merge-ready')
        run: |
          set -euo pipefail

          controller_is_authoritative() {
            local live_head newer_runs

            live_head=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.sha')
            if [[ "$live_head" != "$HEAD_SHA" ]]; then
              echo "Superseded controller: live PR head is $live_head, event head was $HEAD_SHA."
              return 1
            fi

            newer_runs=$(gh api --paginate --slurp \
              --method GET \
              "repos/$GH_REPO/actions/workflows/merge-readiness.yml/runs" \
              -f per_page=100 \
              -f branch="$HEAD_REF" \
              | jq --arg sha "$HEAD_SHA" --argjson run_id "$RUN_ID" '
                  [.[].workflow_runs[]
                    | select(.head_sha == $sha and .id > $run_id)]
                  | length')
            if [[ "$newer_runs" != "0" ]]; then
              echo "Superseded controller: $newer_runs newer readiness run(s) already exist for $HEAD_SHA."
              return 1
            fi

            return 0
          }

          if ! controller_is_authoritative; then
            echo "A newer PR/review event owns readiness; finishing this older run as a successful no-op."
            exit 0
          fi

          live_merge_ready=$(gh api \
            "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            --jq 'any(.[]; .name == "merge-ready")')
          if [[ "$live_merge_ready" == "true" ]]; then
            # Re-check immediately before the destructive label mutation so an
            # already-created newer event wins even if this run started first.
            if ! controller_is_authoritative; then
              echo "A newer event arrived before label invalidation; leaving it to the newer controller."
              exit 0
            fi
            gh api \
              --method DELETE \
              "repos/$GH_REPO/issues/$PR_NUMBER/labels/merge-ready" \
              --silent
            echo "Removed stale merge-ready sign-off."
          fi

          if ! controller_is_authoritative; then
            echo "A newer event arrived before pending status publication; leaving it to the newer controller."
            exit 0
          fi

          gh api \
            --method POST \
            "repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context=merge-readiness \
            -f description='Final review/CI sign-off required' \
            -f target_url="$STATUS_TARGET_URL" \
            --silent

          echo "merge-readiness is pending until merge-ready is re-applied as the final action."

      - name: Verify explicit merge readiness
        if: >-
          github.event.pull_request.base.ref == 'main' &&
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'merge-ready'
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail

          controller_is_authoritative() {
            local live_head newer_runs

            live_head=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.sha')
            if [[ "$live_head" != "$HEAD_SHA" ]]; then
              echo "Superseded controller: live PR head is $live_head, event head was $HEAD_SHA."
              return 1
            fi

            newer_runs=$(gh api --paginate --slurp \
              --method GET \
              "repos/$GH_REPO/actions/workflows/merge-readiness.yml/runs" \
              -f per_page=100 \
              -f branch="$HEAD_REF" \
              | jq --arg sha "$HEAD_SHA" --argjson run_id "$RUN_ID" '
                  [.[].workflow_runs[]
                    | select(.head_sha == $sha and .id > $run_id)]
                  | length')
            if [[ "$newer_runs" != "0" ]]; then
              echo "Superseded controller: $newer_runs newer readiness run(s) already exist for $HEAD_SHA."
              return 1
            fi

            return 0
          }

          reject_gate() {
            local description="$1"
            if ! controller_is_authoritative; then
              echo "A newer event owns readiness; stale rejection '$description' is a successful no-op."
              exit 0
            fi
            gh api \
              --method POST \
              "repos/$GH_REPO/statuses/$HEAD_SHA" \
              -f state=failure \
              -f context=merge-readiness \
              -f description="$description" \
              -f target_url="$STATUS_TARGET_URL" \
              --silent
            gh api \
              --method DELETE \
              "repos/$GH_REPO/issues/$PR_NUMBER/labels/merge-ready" \
              --silent
            echo "merge-readiness rejected: $description"
            exit 0
          }

          repair_pending_if_owned() {
            local description="$1"
            local latest_target
            latest_target=$(gh api \
              "repos/$GH_REPO/commits/$HEAD_SHA/status" \
              --jq '[.statuses[] | select(.context == "merge-readiness")][0].target_url // ""')
            if [[ "$latest_target" != "$STATUS_TARGET_URL" ]]; then
              echo "A newer controller already owns merge-readiness; this run will not overwrite it."
              return 0
            fi
            gh api \
              --method POST \
              "repos/$GH_REPO/statuses/$HEAD_SHA" \
              -f state=pending \
              -f context=merge-readiness \
              -f description="$description" \
              -f target_url="$STATUS_TARGET_URL" \
              --silent
          }

          if ! controller_is_authoritative; then
            echo "A newer PR/review event owns readiness; finishing this older sign-off as a successful no-op."
            exit 0
          fi

          if [[ "$IS_DRAFT" == "true" ]]; then
            reject_gate 'Draft pull request is not merge-ready'
          fi

          # Paginated on purpose: the default page holds 30 check-runs and a head
          # whose CI has been re-run carries more than that, which would hide
          # `verify` behind page one and read exactly like an absent check.
          if ! verify_pages=$(gh api --paginate --slurp \
            "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?per_page=100"); then
            reject_gate 'ci / verify could not be read from the GitHub API'
          fi

          # Report absent, in-flight and concluded separately. Collapsing all three
          # into "missing" makes a check that is merely still running look like a
          # lookup defect, which is exactly how a re-run of `ci` during sign-off
          # reads from the outside.
          verify_state=$(jq -r '
            [.[].check_runs[] | select(.name == "verify")]
            | sort_by(.started_at)
            | last
            | if . == null then "absent"
              elif .conclusion != null then .conclusion
              else "still " + .status
              end' <<<"$verify_pages")
          if [[ "$verify_state" != "success" ]]; then
            reject_gate "ci / verify is $verify_state"
          fi

          owner="${GH_REPO%/*}"
          repo="${GH_REPO#*/}"
          thread_pages=$(gh api graphql --paginate --slurp \
            -f query='query($owner:String!,$repo:String!,$number:Int!,$endCursor:String){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100,after:$endCursor){nodes{isResolved}pageInfo{hasNextPage endCursor}}}}}' \
            -F owner="$owner" \
            -F repo="$repo" \
            -F number="$PR_NUMBER")
          unresolved=$(jq '[.[].data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$thread_pages")

          if [[ "$unresolved" != "0" ]]; then
            reject_gate "$unresolved unresolved review conversation(s) remain"
          fi

          # A newer workflow event must win before this run can publish success.
          # This replaces Actions cancellation as the serialization authority, so
          # superseded controllers end green/no-op instead of leaving cancelled
          # check-runs attached to the PR head.
          if ! controller_is_authoritative; then
            echo "A newer event arrived during sign-off verification; refusing stale success."
            exit 0
          fi

          live_merge_ready=$(gh api \
            "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            --jq 'any(.[]; .name == "merge-ready")')
          if [[ "$live_merge_ready" != "true" ]]; then
            echo "A newer invalidation already removed merge-ready; refusing stale success."
            exit 0
          fi

          gh api \
            --method POST \
            "repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context=merge-readiness \
            -f description='Final review and CI sign-off complete' \
            -f target_url="$STATUS_TARGET_URL" \
            --silent

          # Close both post-write races. If a newer controller appeared after the
          # precheck, only repair this run's own status; never remove a label that
          # may already belong to the newer event. If the newer controller has
          # already written its own status, leave that newer state untouched.
          if ! controller_is_authoritative; then
            repair_pending_if_owned 'Newer review/PR activity invalidated sign-off'
            echo "A newer controller appeared during final sign-off; stale readiness was repaired only if this run still owned it."
            exit 0
          fi

          live_merge_ready_after=$(gh api \
            "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            --jq 'any(.[]; .name == "merge-ready")')
          if [[ "$live_merge_ready_after" != "true" ]]; then
            repair_pending_if_owned 'Newer review/PR activity invalidated sign-off'
            echo "A newer invalidation raced final sign-off; stale readiness was repaired only if this run still owned it."
            exit 0
          fi

          echo "merge-ready applies to $HEAD_SHA, ci / verify passed, all review conversations are resolved, and no newer controller event exists."
