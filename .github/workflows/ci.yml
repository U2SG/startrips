name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  ledger:
    name: ledger
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify a manual recovery run targets the exact main HEAD
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-main-sha.mjs
      - name: Test exact-main recovery guard
        run: node --test scripts/verify-main-sha.node-test.mjs
      - name: Test CFAA tooling
        run: node --test scripts/cfaa.node-test.mjs
      - name: Validate CFAA invariant registry
        run: node scripts/cfaa.mjs validate
      - name: Project CFAA impact for current PR
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/cfaa.mjs impact --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/cfaa-impact.md"
          cat "$RUNNER_TEMP/cfaa-impact.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Test case-insensitive path guard
        run: node --test scripts/check-path-case.node-test.mjs
      - name: Reject tracked paths that collide on case-insensitive filesystems
        run: node scripts/check-path-case.mjs
      - name: Test ledger tooling
        run: node --test scripts/pr-history.node-test.mjs
      - name: Test ledger-only final fast path
        run: node --test scripts/ci-ledger-fast-path.node-test.mjs
      - name: Test browser QA shard runner
        run: node --test scripts/browser-qa-shard.node-test.mjs
      - name: Validate sharded ledgers
        run: node scripts/pr-history.mjs validate-all
      - name: Validate current PR ledger
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr-history.mjs validate-pr --pr "$PR_NUMBER" --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
      - name: Derive the previously validated main commit
        id: derive-before-sha
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-main-sha.mjs derive-before-sha
      - name: Validate main ledger immutability
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          PUSH_BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || steps.derive-before-sha.outputs.before-sha }}
          PUSH_AFTER_SHA: ${{ github.event_name == 'push' && github.event.after || github.sha }}
        run: node scripts/pr-history.mjs validate-push --before "$PUSH_BEFORE_SHA" --after "$PUSH_AFTER_SHA"
      - name: Render aggregate ledger index
        run: |
          node scripts/pr-history.mjs render --output "$RUNNER_TEMP/pr-history-index.md"
          cat "$RUNNER_TEMP/pr-history-index.md" >> "$GITHUB_STEP_SUMMARY"

  core:
    name: core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: startrips_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d startrips_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ORIGIN: http://127.0.0.1:5173
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/startrips_test
      DATABASE_SSL: "false"
      BETTER_AUTH_SECRET: ci-only-secret-with-more-than-thirty-two-bytes
      STORAGE_DRIVER: disabled
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Classify ledger-only final
        id: final-plan
        env:
          CLASSIFY_ONLY: '1'
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-ledger-fast-path.mjs
      - name: Reuse exact Source CI for ledger-only final
        if: steps.final-plan.outputs.ledger_only_final == 'true'
        run: echo "Reusing Source ${{ steps.final-plan.outputs.source_sha }}; verify will independently prove Source CI"
      - uses: pnpm/action-setup@v6
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.final-plan.outputs.ledger_only_final != 'true'
      - name: Verify generated auth schema
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        run: |
          pnpm auth:schema
          git diff --exit-code -- server/db/auth-schema.ts
      - name: Apply migrations to isolated PostgreSQL
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        run: pnpm db:migrate
      - name: Typecheck
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        run: pnpm typecheck
      - name: Control-plane regression suite
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        run: python3 -B -m unittest discover -s tools/control-plane/tests -p 'test_*.py' -v
      - name: Test
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        run: pnpm test
      - name: Build
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        run: pnpm build

  keepsake-render:
    name: keepsake-render
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Classify ledger-only final
        id: final-plan
        env:
          CLASSIFY_ONLY: '1'
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-ledger-fast-path.mjs
      - name: Reuse exact Source CI for ledger-only final
        if: steps.final-plan.outputs.ledger_only_final == 'true'
        run: echo "Reusing Source ${{ steps.final-plan.outputs.source_sha }}; verify will independently prove Source CI"
      - uses: pnpm/action-setup@v6
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        run: pnpm install --frozen-lockfile
      - name: Ensure FFmpeg is available
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Render deterministic private Keepsake fixture twice
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        run: |
          set -euo pipefail
          pnpm qa:keepsake-render
          cat artifacts/keepsake-render/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Keepsake render evidence
        if: ${{ always() && steps.final-plan.outputs.ledger_only_final != 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: keepsake-private-render-${{ github.run_attempt }}
          path: artifacts/keepsake-render/
          if-no-files-found: error
          retention-days: 7
  browser-qa:
    name: browser-qa / ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Outer shard budget only. Each logical suite keeps its original 12-minute cap
    # inside scripts/browser-qa-shard.mjs, so a hung suite cannot consume siblings.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: earth
            suites: "|earth-dive|"
            commands: |
              earth-dive::pnpm qa:earth-dive
          - name: auth-media
            suites: "|login-media|composer-playback-preview|"
            commands: |
              login-media::QA_CAPTURE_MEDIA_MOTION=1 pnpm qa:login-v3 && QA_CAPTURE_MEDIA_MOTION=1 pnpm qa:media-controls && QA_CAPTURE_MEDIA_MOTION=1 pnpm qa:media-reclassification
              composer-playback-preview::pnpm qa:composer-playback-preview
          - name: story-media
            suites: "|story-media-handoff|"
            commands: |
              story-media-handoff::pnpm qa:story-media-handoff
          - name: labels-recovery
            suites: "|city-label-anchoring|recovery-surfaces|"
            commands: |
              city-label-anchoring::pnpm qa:city-label-anchoring
              recovery-surfaces::pnpm qa:recovery-surfaces
          - name: reveal-share
            suites: "|cover-reveal-opening|cover-reveal|owner-share|playback-map-bridge|"
            commands: |
              cover-reveal-opening::pnpm qa:cover-reveal-opening
              cover-reveal::pnpm qa:cover-reveal
              owner-share::pnpm qa:owner-share
              playback-map-bridge::pnpm qa:playback-map-bridge
          - name: playback-brand
            suites: "|playback-prefetch|playback-continuity|playback-manual-camera|final-acceptance|brand-signature-motion|"
            commands: |
              playback-prefetch::pnpm qa:playback-prefetch
              playback-continuity::pnpm qa:playback-continuity
              playback-manual-camera::pnpm qa:playback-manual-camera
              final-acceptance::pnpm qa:final-acceptance
              brand-signature-motion::pnpm qa:brand-signature-motion
          - name: shell-composer
            suites: "|post-login|mobile-contract|composer-route-points|composer-mobile-ia|entry-boundaries|"
            commands: |
              post-login::pnpm qa:post-login-controls
              mobile-contract::pnpm qa:mobile-contract
              composer-route-points::pnpm qa:composer-route-points
              composer-mobile-ia::pnpm qa:composer-mobile-ia
              entry-boundaries::pnpm qa:entry-boundaries
          - name: globe-context
            suites: "|globe-focus-chrome|globe-render-budget|route-point-context|attention-hierarchy|"
            commands: |
              globe-focus-chrome::pnpm qa:globe-focus-chrome
              globe-render-budget::pnpm qa:globe-render-budget
              route-point-context::pnpm qa:route-point-context
              attention-hierarchy::pnpm qa:attention-hierarchy
          - name: route-home-share
            suites: "|route-anchoring|guest-share|home-base-suggestion|home-base-context|"
            commands: |
              route-anchoring::pnpm qa:route-anchoring
              guest-share::pnpm qa:guest-share
              home-base-suggestion::pnpm qa:home-base-suggestion
              home-base-context::pnpm qa:home-base-context

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Classify ledger-only final
        id: final-plan
        env:
          CLASSIFY_ONLY: '1'
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-ledger-fast-path.mjs
      - name: Reuse exact Source CI for ledger-only final
        if: steps.final-plan.outputs.ledger_only_final == 'true'
        run: echo "Reusing Source ${{ steps.final-plan.outputs.source_sha }}; verify will independently prove Source CI"
      - uses: pnpm/action-setup@v6
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.final-plan.outputs.ledger_only_final != 'true'
      - name: Install Chromium
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Run browser QA
        if: steps.final-plan.outputs.ledger_only_final != 'true'
        env:
          QA_COMMANDS: ${{ matrix.commands }}
          QA_SUITE_TIMEOUT_MS: '720000'
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 4173 > /tmp/startrips-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null || (cat /tmp/startrips-vite.log && exit 1)
          node scripts/browser-qa-shard.mjs
      - name: Upload coastline refinement review
        if: ${{ always() && steps.final-plan.outputs.ledger_only_final != 'true' && contains(matrix.suites, '|city-label-anchoring|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coastline-refinement-${{ github.run_attempt }}
          path: artifacts/coastline-refinement/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload cover reveal QA
        if: ${{ always() && steps.final-plan.outputs.ledger_only_final != 'true' && contains(matrix.suites, '|cover-reveal|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cover-reveal-${{ github.run_attempt }}
          path: artifacts/cover-reveal/
          if-no-files-found: error
          retention-days: 7

      - name: Upload cover reveal opening QA
        if: ${{ always() && steps.final-plan.outputs.ledger_only_final != 'true' && contains(matrix.suites, '|cover-reveal-opening|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cover-reveal-opening-${{ github.run_attempt }}
          path: artifacts/cover-reveal-opening/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Composer Route Point QA
        if: ${{ always() && steps.final-plan.outputs.ledger_only_final != 'true' && contains(matrix.suites, '|composer-route-points|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: composer-route-points-${{ github.run_attempt }}
          path: artifacts/composer-route-points/
          if-no-files-found: error
          retention-days: 7

      - name: Upload entry boundary QA
        if: ${{ always() && steps.final-plan.outputs.ledger_only_final != 'true' && contains(matrix.suites, '|entry-boundaries|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: entry-boundaries-${{ github.run_attempt }}
          path: artifacts/entry-boundaries/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Composer mobile IA QA
        if: ${{ always() && steps.final-plan.outputs.ledger_only_final != 'true' && contains(matrix.suites, '|composer-mobile-ia|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: composer-mobile-ia-${{ github.run_attempt }}
          path: artifacts/composer-mobile-ia/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Home Base suggestion capture
        if: ${{ always() && steps.final-plan.outputs.ledger_only_final != 'true' && contains(matrix.suites, '|home-base-suggestion|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: home-base-suggestion-${{ github.run_attempt }}
          path: artifacts/home-base-suggestion/
          if-no-files-found: warn

      - name: Upload Home Base context capture
        if: ${{ always() && steps.final-plan.outputs.ledger_only_final != 'true' && contains(matrix.suites, '|home-base-context|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: home-base-context-${{ github.run_attempt }}
          path: artifacts/home-base-context/
          if-no-files-found: warn

      - name: Upload owner share surface captures
        if: ${{ always() && steps.final-plan.outputs.ledger_only_final != 'true' && contains(matrix.suites, '|owner-share|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: owner-share-surfaces-${{ github.run_attempt }}
          path: artifacts/owner-share-surfaces/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload media motion review
        if: ${{ always() && steps.final-plan.outputs.ledger_only_final != 'true' && contains(matrix.suites, '|login-media|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: media-motion-${{ github.run_attempt }}
          path: artifacts/media-motion/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload visited imprint review
        if: ${{ always() && steps.final-plan.outputs.ledger_only_final != 'true' && contains(matrix.suites, '|globe-render-budget|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: visited-imprint-${{ github.run_attempt }}
          path: artifacts/visited-imprint/
          if-no-files-found: warn
          retention-days: 7

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ always() }}
    permissions:
      contents: read
      actions: read
    needs:
      - ledger
      - core
      - browser-qa
      - keepsake-render
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove reusable Source CI when this is a ledger-only final
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: node scripts/ci-ledger-fast-path.mjs
      - name: Require every validation lane to pass
        env:
          LEDGER_RESULT: ${{ needs.ledger.result }}
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_QA_RESULT: ${{ needs.browser-qa.result }}
          KEEPSAKE_RENDER_RESULT: ${{ needs.keepsake-render.result }}
        run: |
          set -euo pipefail
          echo "ledger=$LEDGER_RESULT"
          echo "core=$CORE_RESULT"
          echo "browser-qa=$BROWSER_QA_RESULT"
          echo "keepsake-render=$KEEPSAKE_RENDER_RESULT"
          [[ "$LEDGER_RESULT" == "success" ]]
          [[ "$CORE_RESULT" == "success" ]]
          [[ "$BROWSER_QA_RESULT" == "success" ]]
          [[ "$KEEPSAKE_RENDER_RESULT" == "success" ]]
