name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ledger:
    name: ledger
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test ledger tooling
        run: node --test scripts/pr-history.node-test.mjs
      - name: Validate sharded ledgers
        run: node scripts/pr-history.mjs validate-all
      - name: Validate current PR ledger
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr-history.mjs validate-pr --pr "$PR_NUMBER" --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
      - name: Validate main ledger immutability
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: node scripts/pr-history.mjs validate-push --before "$PUSH_BEFORE_SHA" --after "$PUSH_AFTER_SHA"
      - name: Render aggregate ledger index
        run: |
          node scripts/pr-history.mjs render --output "$RUNNER_TEMP/pr-history-index.md"
          cat "$RUNNER_TEMP/pr-history-index.md" >> "$GITHUB_STEP_SUMMARY"

  core:
    name: core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: startrips_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d startrips_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ORIGIN: http://127.0.0.1:5173
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/startrips_test
      DATABASE_SSL: "false"
      BETTER_AUTH_SECRET: ci-only-secret-with-more-than-thirty-two-bytes
      STORAGE_DRIVER: disabled
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify generated auth schema
        run: |
          pnpm auth:schema
          git diff --exit-code -- server/db/auth-schema.ts
      - name: Apply migrations to isolated PostgreSQL
        run: pnpm db:migrate
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  browser-qa:
    name: browser-qa / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: login-media
            command: pnpm qa:login-v3 && pnpm qa:media-controls
          - name: post-login
            command: pnpm qa:post-login-controls
          - name: final-acceptance
            command: pnpm qa:final-acceptance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Run browser QA
        env:
          QA_COMMAND: ${{ matrix.command }}
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 4173 > /tmp/startrips-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null || (cat /tmp/startrips-vite.log && exit 1)
          bash -lc "$QA_COMMAND"

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ always() }}
    needs:
      - ledger
      - core
      - browser-qa
    steps:
      - name: Require every validation lane to pass
        env:
          LEDGER_RESULT: ${{ needs.ledger.result }}
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_QA_RESULT: ${{ needs.browser-qa.result }}
        run: |
          set -euo pipefail
          echo "ledger=$LEDGER_RESULT"
          echo "core=$CORE_RESULT"
          echo "browser-qa=$BROWSER_QA_RESULT"
          [[ "$LEDGER_RESULT" == "success" ]]
          [[ "$CORE_RESULT" == "success" ]]
          [[ "$BROWSER_QA_RESULT" == "success" ]]
