name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  ci-plan:
    name: ci-plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      ledger_only_final: ${{ steps.plan.outputs.ledger_only_final }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      reason: ${{ steps.plan.outputs.reason }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify ledger-only final and prove reusable Source CI
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: node scripts/ci-ledger-fast-path.mjs

  ledger:
    name: ledger
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify a manual recovery run targets the exact main HEAD
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-main-sha.mjs
      - name: Test exact-main recovery guard
        run: node --test scripts/verify-main-sha.node-test.mjs
      - name: Test CFAA tooling
        run: node --test scripts/cfaa.node-test.mjs
      - name: Validate CFAA invariant registry
        run: node scripts/cfaa.mjs validate
      - name: Project CFAA impact for current PR
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/cfaa.mjs impact --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/cfaa-impact.md"
          cat "$RUNNER_TEMP/cfaa-impact.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Test ledger tooling
        run: node --test scripts/pr-history.node-test.mjs
      - name: Test ledger-only final fast path
        run: node --test scripts/ci-ledger-fast-path.node-test.mjs
      - name: Validate sharded ledgers
        run: node scripts/pr-history.mjs validate-all
      - name: Validate current PR ledger
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr-history.mjs validate-pr --pr "$PR_NUMBER" --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
      - name: Derive the previously validated main commit
        id: derive-before-sha
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-main-sha.mjs derive-before-sha
      - name: Validate main ledger immutability
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          PUSH_BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || steps.derive-before-sha.outputs.before-sha }}
          PUSH_AFTER_SHA: ${{ github.event_name == 'push' && github.event.after || github.sha }}
        run: node scripts/pr-history.mjs validate-push --before "$PUSH_BEFORE_SHA" --after "$PUSH_AFTER_SHA"
      - name: Render aggregate ledger index
        run: |
          node scripts/pr-history.mjs render --output "$RUNNER_TEMP/pr-history-index.md"
          cat "$RUNNER_TEMP/pr-history-index.md" >> "$GITHUB_STEP_SUMMARY"

  core:
    name: core
    needs: ci-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: startrips_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d startrips_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ORIGIN: http://127.0.0.1:5173
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/startrips_test
      DATABASE_SSL: "false"
      BETTER_AUTH_SECRET: ci-only-secret-with-more-than-thirty-two-bytes
      STORAGE_DRIVER: disabled
    steps:
      - name: Reuse exact Source CI for ledger-only final
        if: needs.ci-plan.outputs.ledger_only_final == 'true'
        run: echo "Reusing Source ${{ needs.ci-plan.outputs.source_sha }} after ledger-only final proof"
      - uses: actions/checkout@v7
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
      - uses: pnpm/action-setup@v6
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
      - name: Verify generated auth schema
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        run: |
          pnpm auth:schema
          git diff --exit-code -- server/db/auth-schema.ts
      - name: Apply migrations to isolated PostgreSQL
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        run: pnpm db:migrate
      - name: Typecheck
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        run: pnpm typecheck
      - name: Control-plane regression suite
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        run: python3 -B -m unittest discover -s tools/control-plane/tests -p 'test_*.py' -v
      - name: Test
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        run: pnpm test
      - name: Build
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        run: pnpm build

  keepsake-render:
    name: keepsake-render
    needs: ci-plan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Reuse exact Source CI for ledger-only final
        if: needs.ci-plan.outputs.ledger_only_final == 'true'
        run: echo "Reusing Source ${{ needs.ci-plan.outputs.source_sha }} after ledger-only final proof"
      - uses: actions/checkout@v7
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        run: pnpm install --frozen-lockfile
      - name: Ensure FFmpeg is available
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Render deterministic private Keepsake fixture twice
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        run: |
          set -euo pipefail
          pnpm qa:keepsake-render
          cat artifacts/keepsake-render/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Keepsake render evidence
        if: ${{ always() && needs.ci-plan.outputs.ledger_only_final != 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: keepsake-private-render-${{ github.run_attempt }}
          path: artifacts/keepsake-render/
          if-no-files-found: error
          retention-days: 7
  browser-qa:
    name: browser-qa / ${{ matrix.name }}
    needs: ci-plan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci-plan.outputs.browser_matrix) }}

    steps:
      - name: Reuse exact Source CI for ledger-only final
        if: needs.ci-plan.outputs.ledger_only_final == 'true'
        run: echo "Reusing Source ${{ needs.ci-plan.outputs.source_sha }} after ledger-only final proof"
      - uses: actions/checkout@v7
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
      - uses: pnpm/action-setup@v6
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
      - name: Install Chromium
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Run browser QA shard
        if: needs.ci-plan.outputs.ledger_only_final != 'true'
        env:
          QA_COMMANDS: ${{ matrix.commands }}
        run: |
          set -euo pipefail
          pnpm exec vite --host 127.0.0.1 --port 4173 > /tmp/startrips-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null || (cat /tmp/startrips-vite.log && exit 1)
          status=0
          while IFS= read -r qa_command; do
            [[ -n "$qa_command" ]] || continue
            echo "::group::$qa_command"
            if ! bash -lc "$qa_command"; then
              echo "::error::Browser QA command failed: $qa_command"
              status=1
            fi
            echo "::endgroup::"
          done <<< "$QA_COMMANDS"
          exit "$status"
      - name: Upload coastline refinement review
        if: ${{ always() && contains(matrix.suites, '|city-label-anchoring|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coastline-refinement-${{ github.run_attempt }}
          path: artifacts/coastline-refinement/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload cover reveal QA
        if: ${{ always() && contains(matrix.suites, '|cover-reveal|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cover-reveal-${{ github.run_attempt }}
          path: artifacts/cover-reveal/
          if-no-files-found: error
          retention-days: 7

      - name: Upload cover reveal opening QA
        if: ${{ always() && contains(matrix.suites, '|cover-reveal-opening|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cover-reveal-opening-${{ github.run_attempt }}
          path: artifacts/cover-reveal-opening/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Composer Route Point QA
        if: ${{ always() && contains(matrix.suites, '|composer-route-points|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: composer-route-points-${{ github.run_attempt }}
          path: artifacts/composer-route-points/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Composer mobile IA QA
        if: ${{ always() && contains(matrix.suites, '|composer-mobile-ia|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: composer-mobile-ia-${{ github.run_attempt }}
          path: artifacts/composer-mobile-ia/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Home Base suggestion capture
        if: ${{ always() && contains(matrix.suites, '|home-base-suggestion|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: home-base-suggestion-${{ github.run_attempt }}
          path: artifacts/home-base-suggestion/
          if-no-files-found: warn

      - name: Upload Home Base context capture
        if: ${{ always() && contains(matrix.suites, '|home-base-context|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: home-base-context-${{ github.run_attempt }}
          path: artifacts/home-base-context/
          if-no-files-found: warn

      - name: Upload owner share surface captures
        if: ${{ always() && contains(matrix.suites, '|owner-share|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: owner-share-surfaces-${{ github.run_attempt }}
          path: artifacts/owner-share-surfaces/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload media motion review
        if: ${{ always() && contains(matrix.suites, '|login-media|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: media-motion-${{ github.run_attempt }}
          path: artifacts/media-motion/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload visited imprint review
        if: ${{ always() && contains(matrix.suites, '|globe-render-budget|') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: visited-imprint-${{ github.run_attempt }}
          path: artifacts/visited-imprint/
          if-no-files-found: warn
          retention-days: 7

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ always() }}
    needs:
      - ci-plan
      - ledger
      - core
      - browser-qa
      - keepsake-render
    steps:
      - name: Require every validation lane to pass
        env:
          CI_PLAN_RESULT: ${{ needs.ci-plan.result }}
          LEDGER_RESULT: ${{ needs.ledger.result }}
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_QA_RESULT: ${{ needs.browser-qa.result }}
          KEEPSAKE_RENDER_RESULT: ${{ needs.keepsake-render.result }}
        run: |
          set -euo pipefail
          echo "ci-plan=$CI_PLAN_RESULT"
          echo "ledger=$LEDGER_RESULT"
          echo "core=$CORE_RESULT"
          echo "browser-qa=$BROWSER_QA_RESULT"
          echo "keepsake-render=$KEEPSAKE_RENDER_RESULT"
          [[ "$CI_PLAN_RESULT" == "success" ]]
          [[ "$LEDGER_RESULT" == "success" ]]
          [[ "$CORE_RESULT" == "success" ]]
          [[ "$BROWSER_QA_RESULT" == "success" ]]
          [[ "$KEEPSAKE_RENDER_RESULT" == "success" ]]
